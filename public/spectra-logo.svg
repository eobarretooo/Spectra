<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="prism-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="prism-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="prism-center" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <polygon points="50,12 88,34 88,78 50,94 12,78 12,34" fill="url(#prism-center)" opacity="0.25" filter="url(#glow)"/>

  <!-- Outer facets -->
  <polygon points="50,15 85,35 50,56" fill="url(#prism-right)" opacity="0.9"/>
  <polygon points="50,15 15,35 50,56" fill="url(#prism-left)" opacity="0.95"/>
  <polygon points="15,35 15,75 50,92 50,56" fill="url(#prism-left)" opacity="0.8"/>
  <polygon points="85,35 85,75 50,92 50,56" fill="url(#prism-right)" opacity="0.85"/>

  <!-- Inner Refraction Crystal -->
  <polygon points="50,28 72,42 72,68 50,80 28,68 28,42" fill="url(#prism-center)" opacity="0.95"/>
  <polygon points="50,28 72,42 50,56 28,42" fill="#ffffff" opacity="0.3"/>
  <polygon points="50,56 72,68 50,80" fill="#a855f7" opacity="0.5"/>
  <polygon points="50,56 28,68 50,80" fill="#06b6d4" opacity="0.5"/>
</svg>
